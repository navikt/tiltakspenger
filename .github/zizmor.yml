# Konfig for zizmor-sikkerhetsrevisjonen (kjøres av den delte lint-workflowen fra navikt/tiltakspenger-workflows).
# Unntak skal alltid ha en begrunnelse her - se .github/workflows/README.md i navikt/tiltakspenger-workflows.

rules:
  unpinned-uses:
    config:
      policies:
        # Delte workflows i navikt/tiltakspenger-workflows refereres bevisst med @main: main i workflows-repoet er en dokumentert tillitsgrense,
        # og callerne skal plukke opp forbedringer uten PR i hvert repo.
        # Mønsteret må ha /* for å matche reusable workflow-stier (owner/repo alene matcher ikke subpath).
        "navikt/tiltakspenger-workflows/*": ref-pin
        # Alt annet krever SHA-pinning (Nav-policy).
        "*": hash-pin
