name: Lint workflows

on:
  # Manuell trigger: begge de andre triggerne er sti-filtrerte, så en kjøring som feiler på
  # infrastruktur (f.eks. «Failed to resolve action download info») ellers etterlater main rød
  # til noen tilfeldigvis endrer .github/ igjen.
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/**'
  push:
    branches: [ main ]
    paths:
      - '.github/**'

# Minste privilegium: toppnivået nullstiller alle token-rettigheter, hver jobb deklarerer eksplisitt det den trenger.
permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    uses: navikt/tiltakspenger-workflows/.github/workflows/lint-workflows.yml@main
    with:
      # Metarepoets dependabot.yml er bevisst kun github-actions (auto ville krevd gradle-malen pga. rot-gradlefila).
      dependabot-mal: ingen
